name: Build SubNetCalc macOS

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
      - "**"
  pull_request:
    branches:
      - main
      - master
  # checkov:skip=CKV_GHA_7: Allow manual workflow_dispatch inputs for flexible builds
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, atau commit SHA yang ingin di-build (contoh: main, v1.0.0)"
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 22.x
  CSC_IDENTITY_AUTO_DISCOVERY: false
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── macOS Intel ───────────────────────────────────────────
          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            arch_label: Intel x64
            build_script: dist:mac

          # ─── macOS Apple Silicon (macOS Latest) ────────────────────
          - runs_on: macos-latest
            platform: mac
            arch: arm64
            arch_label: Apple Silicon ARM64 (macOS Latest)
            build_script: dist:mac:arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Inspect Runner Environment
        shell: bash
        run: |
          echo "=========================================="
          echo "Runner Name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
          echo "Target Arch : ${{ matrix.arch }}"
          echo "System Arch : $(uname -m)"
          echo "Event Name  : $GITHUB_EVENT_NAME"
          echo "Trigger Ref : $GITHUB_REF"
          echo "Target Ref  : ${{ inputs.ref || github.ref }}"
          sw_vers || true
          echo "=========================================="

      - name: Setup NodeJS for macOS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        shell: bash
        run: npm ci

      - name: Run Quality Verification & Tests
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build macOS DMG & ZIP (${{ matrix.arch_label }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mdutil -a -i off 2>/dev/null || true
          echo "Building SubNetCalc for macOS ${{ matrix.arch }} using '${{ matrix.build_script }}'..."
          npm run ${{ matrix.build_script }} || {
            echo "First DMG build attempt failed, retrying after cleanup..."
            sleep 3
            npm run ${{ matrix.build_script }}
          }

      - name: Verify Output Files
        shell: bash
        run: |
          echo "=== Content of release/ directory ==="
          ls -lh release/

      - name: Upload macOS Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: subnetcalc-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

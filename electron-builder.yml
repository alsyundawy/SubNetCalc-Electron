appId: com.alsyundawy.subnetcalc
productName: SubNetCalc
directories:
  output: release
compression: maximum
removePackageScripts: true
removePackageKeywords: true
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules"
  - "!test/**/*"
  - "!*.mmdb"
  - "!*.csv"
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  category: Network
  target:
    - target: AppImage
    - target: deb
win:
  target:
    - target: nsis

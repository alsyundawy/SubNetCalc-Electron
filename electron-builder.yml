---
appId: com.alsyundawy.subnetcalc
productName: SubNetCalc Electron
directories:
  output: release
compression: maximum
removePackageScripts: true
removePackageKeywords: true
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules"
  - "!test/**/*"
  - "!*.mmdb"
  - "!*.csv"
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  artifactName: SubNetCalc-Electron-${version}-${arch}.${ext}
  target:
    - target: dmg
    - target: zip
linux:
  category: Network
  target:
    - target: AppImage
    - target: deb
win:
  artifactName: SubNetCalc-Electron-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SubNetCalc Electron
  runAfterFinish: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
